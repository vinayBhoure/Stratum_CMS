<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stratum CMS — Get Clerk Token</title>
  <!--
    Key must be on the script tag so Clerk's browser bundle picks it up.
    Script must load from Clerk's own CDN (not jsDelivr) — window.Clerk
    is a pre-configured instance in v5, not a constructor.
  -->
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_dG9nZXRoZXItd2VyZXdvbGYtOTIuY2xlcmsuYWNjb3VudHMuZGV2JA"
    src="https://together-werewolf-92.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"
  ></script>
  <style>
    body { font-family: monospace; max-width: 640px; margin: 60px auto; padding: 0 20px; }
    button { padding: 8px 16px; margin: 8px 4px; cursor: pointer; font-family: monospace; }
    #token { word-break: break-all; background: #f4f4f4; padding: 12px; margin-top: 12px; white-space: pre-wrap; min-height: 20px; }
    .status { color: #888; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>Stratum CMS — Clerk Token Helper</h2>
  <p>Sign in, then click <strong>Get Token</strong> and copy the JWT for use as <code>TEST_TOKEN</code>.</p>

  <button id="sign-in-btn"  style="display:none" onclick="signIn()">Sign In</button>
  <button id="sign-out-btn" style="display:none" onclick="signOut()">Sign Out</button>
  <button id="get-token-btn" style="display:none" onclick="getToken()">Get Token</button>
  <button id="copy-btn"     style="display:none" onclick="copyToken()">Copy Token</button>

  <div class="status" id="status">Loading Clerk...</div>
  <div id="token"></div>

  <script>
    const setStatus = (msg) => { document.getElementById('status').textContent = msg; };

    function updateUI() {
      const signedIn = !!window.Clerk.user;
      document.getElementById('sign-in-btn').style.display   = signedIn ? 'none'   : 'inline';
      document.getElementById('sign-out-btn').style.display  = signedIn ? 'inline' : 'none';
      document.getElementById('get-token-btn').style.display = signedIn ? 'inline' : 'none';
      document.getElementById('copy-btn').style.display = 'none';
      document.getElementById('token').textContent = '';
      setStatus(signedIn
        ? 'Signed in as: ' + (window.Clerk.user.primaryEmailAddress?.emailAddress ?? window.Clerk.user.id)
        : 'Not signed in.');
    }

    async function signIn() {
      window.Clerk.openSignIn({});
      window.Clerk.addListener(({ user }) => { if (user) updateUI(); });
    }

    async function signOut() {
      await window.Clerk.signOut();
      updateUI();
    }

    async function getToken() {
      try {
        const token = await window.Clerk.session.getToken();
        document.getElementById('token').textContent = token;
        document.getElementById('copy-btn').style.display = 'inline';
        setStatus('Token ready — copy and use as TEST_TOKEN');
      } catch (err) {
        setStatus('Error: ' + err.message);
      }
    }

    function copyToken() {
      navigator.clipboard.writeText(document.getElementById('token').textContent)
        .then(() => setStatus('Copied to clipboard!'));
    }

    window.addEventListener('load', async () => {
      try {
        await window.Clerk.load();
        updateUI();
      } catch (err) {
        setStatus('Clerk load error: ' + err.message);
      }
    });
  </script>
</body>
</html>
